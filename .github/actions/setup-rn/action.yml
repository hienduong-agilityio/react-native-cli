name: Setup React Native
description: Configure Node.js with Yarn cache and install JS dependencies

runs:
  using: composite
  steps:
    # Restore node_modules from actions/cache keyed by yarn.lock so installs skip cold resolution.
    - name: Cache node_modules (yarn.lock)
      uses: actions/cache@v4
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('yarn.lock', 'package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-modules-

    - name: Setup Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: yarn

    - name: Install JS dependencies
      shell: bash
      run: yarn install --frozen-lockfile
