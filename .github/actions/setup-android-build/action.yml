name: Setup Android build
description: Yarn (cached), JDK, Gradle user-home cache

inputs:
  java-version:
    description: JDK version
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-rn
      env:
        NODE_ENV: development

    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Match Gradle classpath changes via android Gradle inputs; restores wrapper + downloaded deps across runs.
    - name: Cache Gradle caches and wrapper
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
