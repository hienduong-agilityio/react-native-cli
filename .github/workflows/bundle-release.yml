name: Release AAB

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional note for the job summary
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      WITH_ROZENITE: ${{ vars.WITH_ROZENITE }}
      NODE_ENV: production
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      OUT_AAB: android/app/build/outputs/bundle/release/app-release.aab
      OUT_APK: android/app/build/outputs/apk/release/app-release.apk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/prepare-android
        with:
          java-version: ${{ vars.JAVA_VERSION }}
          api-base-url: ${{ vars.API_BASE_URL }}
          strapi-base-url: ${{ vars.STRAPI_BASE_URL }}
          load-storybook: ${{ vars.LOAD_STORYBOOK }}
          uses-cleartext-traffic: ${{ vars.USES_CLEARTEXT_TRAFFIC }}

      - name: bundleRelease assembleRelease
        working-directory: android
        env:
          ENVFILE: ${{ github.workspace }}/.env.production
        run: ./gradlew bundleRelease assembleRelease --no-daemon --parallel --stacktrace

      - name: Verify Gradle outputs (AAB + APK)
        run: test -f "$OUT_AAB" && test -f "$OUT_APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ github.run_number }}-${{ github.sha }}
          path: ${{ env.OUT_AAB }}
          retention-days: 30
          if-no-files-found: error

      - if: always()
        run: |
          {
            echo "## AAB (GitHub artifact — Play Console)"
            echo "Artifact: android-aab-${{ github.run_number }}-${{ github.sha }}"
            echo "## Firebase App Distribution"
            echo "APK: ${OUT_APK}"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.release_notes != ''
        run: printf '%s\n' "Notes — ${{ github.event.inputs.release_notes }}" >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: rm -f android/app/google-services.json
