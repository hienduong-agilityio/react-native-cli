name: Android pull request APK

on:
  pull_request:
    branches: [develop]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'yarn.lock'
      - 'index.js'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'react-native.config.js'
      - '.github/actions/**'
      - '.github/workflows/android-pull-request-apk.yml'

concurrency:
  group: android-pull-request-apk-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  build:
    name: Preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WITH_ROZENITE: ${{ vars.WITH_ROZENITE }}
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-android-build
        with:
          java-version: ${{ vars.JAVA_VERSION }}

      - name: Create .env.production
        run: |
          cat > .env.production <<EOF
          API_BASE_URL=${{ vars.API_BASE_URL }}
          STRAPI_BASE_URL=${{ vars.STRAPI_BASE_URL }}
          LOAD_STORYBOOK=${{ vars.LOAD_STORYBOOK }}
          USES_CLEARTEXT_TRAFFIC=${{ vars.USES_CLEARTEXT_TRAFFIC }}
          EOF

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "::error::Missing secret (fork PRs have no secrets)."; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Clear autolinking cache
        run: rm -rf android/build/generated/autolinking

      - name: Gradle assembleRelease
        working-directory: android
        env:
          ENVFILE: ../.env.production
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: android-pull-request-apk-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      - if: success()
        run: |
          echo "## Android pull request APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact: **android-pull-request-apk-${{ github.event.pull_request.number }}-${{ github.sha }}** (7 days)" >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        run: rm -f android/app/google-services.json
