name: PR Quality Gate

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rn
      - run: yarn lint

  format:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rn
      - run: yarn prettier:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rn
      - run: npx tsc --noEmit

  unit-test:
    name: Jest unit tests
    runs-on: ubuntu-latest
    # TODO(rn-cicd): remove `continue-on-error` once stale snapshots + failing tests are fixed.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rn
      - run: yarn test:coverage --ci --maxWorkers=2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, unit-test, dependency-review, secret-scan]
    if: always()
    steps:
      - name: Aggregate job results
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq .
          if echo "$RESULTS" | jq -e '
            to_entries
            | map(select(.key != "unit-test"))
            | map(.value.result)
            | any(. != "success" and . != "skipped")
          ' > /dev/null; then
            echo "::error::One or more required quality checks failed."
            exit 1
          fi
          echo "All required quality checks passed."
