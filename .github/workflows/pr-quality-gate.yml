name: PR Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  format:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn prettier:check

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx tsc --noEmit

  unit-test:
    name: Jest unit tests
    runs-on: ubuntu-latest
    # TODO(rn-cicd): Remove `continue-on-error` once the existing 91 failing
    # tests + 53 stale snapshots are fixed (tracking issue: TBD).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Run Jest with coverage
        run: yarn test:coverage --ci --maxWorkers=2
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [lint, format, typecheck, unit-test, dependency-review, secret-scan]
    if: always()
    steps:
      - name: Aggregate job results
        env:
          RESULTS: ${{ toJson(needs) }}
        run: |
          echo "$RESULTS" | jq .
          # Fail if any required job failed (skipped/cancelled also count as fail)
          if echo "$RESULTS" | jq -e '
            to_entries
            | map(select(.key != "unit-test"))
            | map(.value.result)
            | any(. != "success" and . != "skipped")
          ' > /dev/null; then
            echo "::error::One or more required quality checks failed."
            exit 1
          fi
          echo "All required quality checks passed."
