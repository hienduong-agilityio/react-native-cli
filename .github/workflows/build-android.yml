name: Build Android (AAB)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional release notes (printed in the job summary)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Build & sign release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      WITH_ROZENITE: ${{ vars.WITH_ROZENITE }}
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: yarn

      - name: Setup JDK ${{ vars.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Generate .env.production from environment variables
        run: |
          {
            echo "API_BASE_URL=${{ vars.API_BASE_URL }}"
            echo "STRAPI_BASE_URL=${{ vars.STRAPI_BASE_URL }}"
            echo "LOAD_STORYBOOK=${{ vars.LOAD_STORYBOOK }}"
            echo "USES_CLEARTEXT_TRAFFIC=${{ vars.USES_CLEARTEXT_TRAFFIC }}"
          } > .env.production
          echo "Generated .env.production:"
          cat .env.production

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          echo "google-services.json size: $(wc -c < android/app/google-services.json) bytes"

      - name: Restore upload keystore from secret
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          echo "Keystore restored to $RUNNER_TEMP/upload.keystore"

      - name: Build signed release AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew bundleRelease \
            --init-script ../.github/gradle/signing.init.gradle \
            --no-daemon --stacktrace

      - name: Verify AAB exists
        run: |
          AAB_PATH=android/app/build/outputs/bundle/release/app-release.aab
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::AAB not found at $AAB_PATH"
            exit 1
          fi
          AAB_SIZE=$(du -h "$AAB_PATH" | cut -f1)
          echo "AAB built: $AAB_PATH ($AAB_SIZE)"
          echo "AAB_PATH=$AAB_PATH" >> "$GITHUB_ENV"
          echo "AAB_SIZE=$AAB_SIZE" >> "$GITHUB_ENV"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Build Android AAB'
            echo ''
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- AAB size: \`${AAB_SIZE:-n/a}\`"
            if [ -n "${{ github.event.inputs.release_notes }}" ]; then
              echo "- Release notes: ${{ github.event.inputs.release_notes }}"
            fi
            echo ''
            echo 'Artifact name: `app-release-${{ github.run_number }}-${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup secrets from disk
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/upload.keystore" || true
          rm -f android/app/google-services.json || true
