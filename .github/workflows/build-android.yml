name: Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: Build type
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    name: Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'debug') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: yarn

      - name: Setup JDK ${{ vars.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          echo "google-services.json size: $(wc -c < android/app/google-services.json) bytes"

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup google-services.json
        if: always()
        run: rm -f android/app/google-services.json || true

  android-release:
    name: Android (release APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release')
    env:
      WITH_ROZENITE: ${{ vars.WITH_ROZENITE }}
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ vars.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: yarn

      - name: Setup JDK ${{ vars.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Generate .env.production from environment variables
        run: |
          {
            echo "API_BASE_URL=${{ vars.API_BASE_URL }}"
            echo "STRAPI_BASE_URL=${{ vars.STRAPI_BASE_URL }}"
            echo "LOAD_STORYBOOK=${{ vars.LOAD_STORYBOOK }}"
            echo "USES_CLEARTEXT_TRAFFIC=${{ vars.USES_CLEARTEXT_TRAFFIC }}"
          } > .env.production
          echo "Generated .env.production:"
          cat .env.production

      - name: Restore google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is empty."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          echo "google-services.json size: $(wc -c < android/app/google-services.json) bytes"

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=app/release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify artifacts
        run: |
          APK_GLOB=android/app/build/outputs/apk/release/*.apk
          AAB_PATH=android/app/build/outputs/bundle/release/app-release.aab
          if ! compgen -G "$APK_GLOB" > /dev/null; then
            echo "::error::Release APK not found under android/app/build/outputs/apk/release/"
            exit 1
          fi
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::AAB not found at $AAB_PATH"
            exit 1
          fi
          echo "APK(s) and AAB present."

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 14
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Android release build'
            echo ''
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo ''
            echo "### Artifacts"
            echo '- `android-release-apk-${{ github.run_number }}-${{ github.sha }}`'
            echo '- `android-release-aab-${{ github.run_number }}-${{ github.sha }}`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing and secrets from disk
        if: always()
        run: |
          rm -f android/app/release.keystore || true
          rm -f android/keystore.properties || true
          rm -f android/app/google-services.json || true
