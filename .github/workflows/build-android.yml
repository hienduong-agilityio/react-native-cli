name: Build Android (AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional release notes (printed in the job summary)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  build-android:
    name: Build release AAB (CI debug-signed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      WITH_ROZENITE: ${{ vars.WITH_ROZENITE }}
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rn
        env:
          NODE_ENV: development

      - name: Setup JDK ${{ vars.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate .env.production from environment vars
        run: |
          cat > .env.production <<EOF
          API_BASE_URL=${{ vars.API_BASE_URL }}
          STRAPI_BASE_URL=${{ vars.STRAPI_BASE_URL }}
          LOAD_STORYBOOK=${{ vars.LOAD_STORYBOOK }}
          USES_CLEARTEXT_TRAFFIC=${{ vars.USES_CLEARTEXT_TRAFFIC }}
          EOF

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is empty."; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Clear stale React Native autolinking metadata
        run: rm -rf android/build/generated/autolinking

      - name: Build release AAB
        working-directory: android
        env:
          ENVFILE: ../.env.production
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Locate AAB
        id: aab
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "::error::AAB not found at $AAB"; exit 1; }
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$AAB" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.aab.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build Android AAB (debug-signed on CI)"
            echo "- **Play upload:** this AAB uses the **debug** keystore on GitHub Actions. For production, sign locally with \`android/keystore.properties\` or add a separate release job later."
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- AAB size: \`${{ steps.aab.outputs.size || 'n/a' }}\`"
            if [ -n "${{ github.event.inputs.release_notes }}" ]; then
              echo "- Release notes: ${{ github.event.inputs.release_notes }}"
            fi
            echo "- Artifact: \`app-release-${{ github.run_number }}-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup CI-only files
        if: always()
        run: rm -f android/app/google-services.json
