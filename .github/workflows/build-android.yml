name: Build Android (AAB)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional release notes (printed in the job summary)
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  build-android:
    name: Build & sign release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      WITH_ROZENITE: ${{ vars.WITH_ROZENITE }}
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rn
        env:
          NODE_ENV: development

      - name: Setup JDK ${{ vars.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate .env.production from environment vars
        run: |
          cat > .env.production <<EOF
          API_BASE_URL=${{ vars.API_BASE_URL }}
          STRAPI_BASE_URL=${{ vars.STRAPI_BASE_URL }}
          LOAD_STORYBOOK=${{ vars.LOAD_STORYBOOK }}
          USES_CLEARTEXT_TRAFFIC=${{ vars.USES_CLEARTEXT_TRAFFIC }}
          EOF

      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is empty."; exit 1; }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      # Full `keystore.properties` via printf (safe for passwords with $, #, etc.); Gradle stays a plain file reader.
      - name: Decode keystore + write android/keystore.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is empty."; exit 1; }
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || { echo "::error::ANDROID_KEYSTORE_PASSWORD secret is empty."; exit 1; }
          [ -n "$ANDROID_KEY_ALIAS" ] || { echo "::error::ANDROID_KEY_ALIAS secret is empty."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          : > android/keystore.properties
          printf '%s\n' 'storeFile=release.keystore' >> android/keystore.properties
          printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD" >> android/keystore.properties
          printf '%s\n' "keyAlias=${ANDROID_KEY_ALIAS}" >> android/keystore.properties
          KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          printf 'keyPassword=%s\n' "$KEY_PASS" >> android/keystore.properties

      - name: Clear stale React Native autolinking metadata
        run: rm -rf android/build/generated/autolinking

      - name: Build signed release AAB
        working-directory: android
        env:
          ENVFILE: ../.env.production
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Locate AAB
        id: aab
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          [ -f "$AAB" ] || { echo "::error::AAB not found at $AAB"; exit 1; }
          echo "path=$AAB" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$AAB" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.aab.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Build Android AAB"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- AAB size: \`${{ steps.aab.outputs.size || 'n/a' }}\`"
            if [ -n "${{ github.event.inputs.release_notes }}" ]; then
              echo "- Release notes: ${{ github.event.inputs.release_notes }}"
            fi
            echo "- Artifact: \`app-release-${{ github.run_number }}-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup signing artifacts
        if: always()
        run: |
          rm -f android/app/release.keystore
          rm -f android/keystore.properties
          rm -f android/app/google-services.json
