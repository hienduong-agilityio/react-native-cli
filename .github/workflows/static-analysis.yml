name: Static analysis

on:
  workflow_call:

permissions:
  contents: read

env:
  NODE_VERSION: ${{ vars.NODE_VERSION }}

jobs:
  analyze:
    name: Lint, format, types, test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-rn

      - name: Lint
        run: yarn lint

      - name: Format
        run: yarn prettier:check

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test:coverage --ci --maxWorkers=2

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore
